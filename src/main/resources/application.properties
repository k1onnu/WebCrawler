#Names
spring.application.name=webcrawler

#Server
server.port=8080

#H2
spring.datasource.url=jdbc:h2:mem:crawlerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/db

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Crawler
crawler.pool.size=4
crawler.scheduler.pool.size=1
crawler.schedule.delay=600000

# User-Agent for HTTP-requests
crawler.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
